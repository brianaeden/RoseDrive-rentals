<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rose Drive Rentals</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #cc307e;
      --pink-soft: #ff6fb8;
      --bg-dark: #0b0b10;
      --glass: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.15);
      --text-soft: rgba(255,255,255,0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top, #451736, transparent 55%),
        linear-gradient(to bottom, #1b0915, #000000);
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 28px 18px 60px;
    }
    /* Hero */
    h1 {
      font-family: "Playfair Display", serif;
      font-size: 32px;
      line-height: 1;
      margin-bottom: 18px;
      letter-spacing: 1px;
    }

    h1 span {
      color: var(--pink);
      display: block;
      margin-top: 6px;
    }

    .subtitle {
      font-size: 18px;
      color: var(--text-soft);
      line-height: 1.6;
      margin-bottom: 34px;
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 600;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      font-size: 16px;
    }

    .btn-primary {
      background: var(--pink);
      color: white;
      box-shadow: 0 10px 30px rgba(255,60,158,0.4);
    }

    .btn-secondary {
      border: 1px solid var(--glass-border);
      color: white;
      background: transparent;
    }

    /* Card */
    .card {
      margin-top: 40px;
      padding: 24px;
      border-radius: 24px;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.04)
      );
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
    }

    .card h2 {
      font-family: "Playfair Display", serif;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--text-soft);
      margin-bottom: 20px;
    }

    input,
    textarea {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      color: white;
      font-size: 15px;
    }

    textarea {
      resize: none;
      height: 110px;
    }

    .send {
      background: var(--pink);
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      width: 100%;
      cursor: pointer;
    }

    /* Contact Info */
    .contact-info {
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      font-size: 15px;
    }

    .contact-info div {
      margin-bottom: 8px;
    }

    /* Footer */
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="badge">
      
    </div>

    <h1>
      <span>ROSE DRIVE RENTALS</span>
    </h1>

    <p class="subtitle">
       Bold. Iconic. Elevate
    </p>

    <a class="btn btn-primary" href="https://turo.com/host/5842406" target="_blank">
      Book Your Ride on TURO
    </a>

    <a class="btn btn-secondary" href="#contact">
      Message Us
    </a>

    <div id="contact" class="card">
      <h2>Contact Us</h2>
      <input type="text" placeholder="Name" />
      <input type="email" placeholder="Email" />
      <input type="tel" placeholder="Phone Number" />
      <textarea placeholder="Message"></textarea>

      <button class="send">Send Message</button>

      <div class="contact-info">
        <div> inquiry@thebmdc.org</div>
      </div>
    </div>

    <footer>
      <div>Rose Drive Rentals</div>
    </footer>

  </div>
</body>
</html>
